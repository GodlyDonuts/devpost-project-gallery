name: Scrape Devpost hackathon galleries

on:
  schedule:
    # Hourly so each 46k-participant crawl makes steady progress and galleries
    # backfill automatically once Devpost publishes them.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      hackathon_slug:
        description: "Only scrape this hackathon slug (leave empty for all)"
        required: false

permissions:
  contents: write

concurrency:
  group: scrape-devpost
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # ~5h45m; cron re-runs continue via per-hackathon checkpoint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Check the official public gallery
        id: public_gallery
        env:
          PAGE_DELAY: "0.35"
        run: |
          set +e
          python3 public_gallery.py
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Discover additional public submissions
        if: steps.public_gallery.outputs.published == 'false'
        env:
          MAX_HANDLES: "50"
          MAX_NEW: "100"
          PAGE_DELAY: "0.35"
        run: python3 snowball.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update gallery data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
